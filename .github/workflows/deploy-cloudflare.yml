name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Flutter web
        run: flutter build web --release --dart-define=CLOUDFLARE_API_BASE_URL=https://halqat-app.husseinalhadi21.workers.dev

      - name: Configure D1 database ID
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node -e "const fs = require('fs'); const id = process.env.CLOUDFLARE_D1_DATABASE_ID || ''; if (!/^(?:[0-9a-f]{32}|[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12})$/i.test(id)) throw new Error('Set the CLOUDFLARE_D1_DATABASE_ID repository variable to the D1 database ID'); const path = 'wrangler.jsonc'; const config = fs.readFileSync(path, 'utf8'); fs.writeFileSync(path, config.replace('__CLOUDFLARE_D1_DATABASE_ID__', id));"

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f77541dac46d47974971d8547fea733d
          command: d1 migrations apply halqat-app-db --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f77541dac46d47974971d8547fea733d
          command: deploy
